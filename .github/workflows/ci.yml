name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies (pinned lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (with coverage)
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # Fails on high or critical (KAN-61 AC4). Moderate and below are
      # reported by `npm audit` locally but do not gate the merge.
      #
      # Accepted advisories are pinned out via `overrides` in package.json
      # rather than suppressed here, so the audit output stays honest — an
      # ignore-list would hide a future advisory in the same package.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/

  sast:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/react

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - name: Check dependency licenses
        run: npx license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"
