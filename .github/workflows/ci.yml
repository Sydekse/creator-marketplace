name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies (pinned lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (with coverage)
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # Fails on high or critical (KAN-61 AC4). Moderate and below are
      # reported by `npm audit` locally but do not gate the merge.
      #
      # Accepted advisories are pinned out via `overrides` in package.json
      # rather than suppressed here, so the audit output stays honest — an
      # ignore-list would hide a future advisory in the same package.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/

  sast:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/react

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - name: Check dependency licenses
        run: npx license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"

  # The four Playwright projects run as a matrix — one runner per project, each
  # with its own Postgres service — rather than a serial loop on a single
  # runner. Wall-clock becomes the slowest single project instead of the sum of
  # four, and each leg installs only the one engine it needs (the chromium legs
  # never download webkit, and vice versa).
  e2e-matrix:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    # A hung `playwright install` once ran 35+ minutes against the 6-hour
    # default ceiling; this kills a stuck leg fast. A healthy leg is ~2–3 min.
    timeout-minutes: 15
    strategy:
      # Each leg seeds its own database on its own runner, so a red project must
      # not cancel the others — every project's verdict stands on its own.
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: webkit-desktop
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marketplace
      SEED_DEMO_PASSWORD: demo-Passw0rd!
      # Better Auth throws on the default secret and warns without a base URL;
      # the built server inherits both through the Playwright webServer env.
      BETTER_AUTH_SECRET: e2e-test-secret-8f3a9c2e6d1b4a7f
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      # The browser binaries live in ~/.cache/ms-playwright and are the slow,
      # network-bound half of the install — cache them keyed on the lockfile so
      # a hit skips the download. The OS libraries `--with-deps` pulls are
      # system packages that do not survive between runs, so on a hit we still
      # install just those via `install-deps`.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (${{ matrix.browser }}) with OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Migrate and seed
        run: npx drizzle-kit migrate && npx tsx db/seed.ts
      # The Playwright webServers only `start` the built app, so the build must
      # precede them; two servers sharing one `.next` cannot build concurrently.
      - name: Build
        run: npm run build
      # One project against one fresh database and its own webServers, so there
      # is no cross-project state to reset — the old per-project DROP SCHEMA loop
      # is gone. The :3002 failure server still arms its fail-once flag at boot.
      - name: Run e2e project
        run: npx playwright test --project="${{ matrix.project }}"
      # KAN-60 AC-10: failures upload the trace and screenshots as artifacts.
      # The name is per-project so parallel legs do not collide on upload.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # One stable check that is green only when every matrix leg passed, so branch
  # protection can require a single name no matter how many projects exist. The
  # name is unchanged from when this was one job, so an existing required check
  # keeps resolving.
  e2e:
    name: End-to-End (Playwright, Chrome + Safari)
    needs: [e2e-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every e2e project to pass
        run: |
          result="${{ needs.e2e-matrix.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::e2e matrix did not pass (result: $result)"
            exit 1
          fi
          echo "All Playwright projects passed."

  integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      # KAN-59 AC-7: an ephemeral database per run, torn down when the job
      # ends. The ticket says "Neon branch"; this provisions a postgres:16
      # service container instead — same isolation and teardown, and Neon *is*
      # Postgres 16, so pointing DATABASE_URL at a fresh Neon branch works
      # identically. The global setup migrates + seeds whatever it is pointed at.
      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/marketplace
          SEED_DEMO_PASSWORD: demo-Passw0rd!
